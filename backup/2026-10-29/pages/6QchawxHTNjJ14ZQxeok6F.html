<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>תיבת התמונות של שרה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one column: big upload button on top, list of what arrived below */
:root{--bg:#faf7f8;--fg:#2b2228;--muted:#7a6b74;--card:#fff;--line:#eadfe5;--accent:#a8436f;--ok:#2f7d4f;--err:#b3261e;
--f:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c171a;--fg:#f2eaee;--muted:#b3a3ac;--card:#272024;--line:#3a3036;--accent:#e07aa6;--ok:#6fcf97;--err:#f28b82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c171a;--fg:#f2eaee;--muted:#b3a3ac;--card:#272024;--line:#3a3036;--accent:#e07aa6;--ok:#6fcf97;--err:#f28b82;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;direction:rtl}
.wrap{max-width:560px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-size:26px;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted);line-height:1.5}
.pick{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:16px;padding:22px 16px;font-size:20px;font-weight:700;cursor:pointer}
.pick:focus-within{outline:3px solid var(--fg);outline-offset:3px}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
#status{min-height:1.4em;font-weight:600}
#status.ok{color:var(--ok)}#status.err{color:var(--err)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;min-width:0}
.it img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--bg);border-radius:8px}
.it small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.empty{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
</style>
<div class="wrap">
  <h1>תיבת התמונות 📥</h1>
  <p>כאן שולחים לי תמונות כשההעלאה בשיחה לא עובדת. בוחרים תמונה (או כמה ביחד), מחכים ל"✓ הגיע", וזהו. אני רואה אותן מיד.</p>
  <label class="pick" id="pickLbl">📷 בחרי תמונות לשליחה
    <input type="file" id="f" accept="image/*" multiple>
  </label>
  <div id="status" role="status"></div>
  <h2 style="font-size:18px;margin:0">מה כבר הגיע אליי</h2>
  <div class="list" id="list"><div class="empty" id="empty">עוד לא נשלחו תמונות.</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let assets=null,db=null;
function status(t,c){const s=$('status');s.textContent=t;s.className=c||''}
function render(rows){
  const L=$('list');L.innerHTML='';
  if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent='עוד לא נשלחו תמונות.';L.appendChild(d);return}
  rows.sort((a,b)=>b.at-a.at).forEach(r=>{
    const d=document.createElement('div');d.className='it';
    const i=document.createElement('img');i.src='/_blob/'+r.asset;i.alt=r.name||'';i.loading='lazy';
    const s=document.createElement('small');
    s.textContent=(r.name||'תמונה')+' · '+new Date(r.at).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
    d.append(i,s);L.appendChild(d);
  });
}
async function boot(){
  try{assets=await window.claude.use('assets');db=await window.claude.use('db')}catch(e){}
  if(!assets){status('אין לי גישה להעלאה מהמסך הזה. פתחי את הדף מתוך הפרויקט שלך (או ב-Chrome) ונסי שוב.','err');$('f').disabled=true;return}
  if(db){db.collection('uploads').onSnapshot(sn=>{render(sn.docs.map(d=>d.data()))},()=>{})}
}
$('f').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length||!assets)return;
  let ok=0;
  for(let n=0;n<files.length;n++){
    const f=files[n];
    status('שולחת '+(n+1)+' מתוך '+files.length+'…');
    try{
      const r=await assets.upload(f);
      const at=Date.now();
      if(db){await db.collection('uploads').doc(r.id).set({asset:r.id,name:f.name,at,size:r.sizeBytes})}
      ok++;
    }catch(err){status('התמונה '+f.name+' לא עלתה ('+(err&&err.code||'שגיאה')+'). נסי אותה שוב.','err');return}
  }
  status('✓ הגיע! '+ok+(ok==1?' תמונה נשלחה':' תמונות נשלחו')+'. אפשר לכתוב לי בשיחה.','ok');
});
setTimeout(boot,0);
</script>

</body></html>
